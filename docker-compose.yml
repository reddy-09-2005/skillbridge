version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: skillbridge_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: skillbridge_root_password
      MYSQL_DATABASE: skillbridge
      MYSQL_USER: skilluser
      MYSQL_PASSWORD: skillpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pskillbridge_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Flask Web Service (Backend + Static Frontend)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillbridge_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=skilluser
      - MYSQL_PASSWORD=skillpassword
      - MYSQL_DATABASE=skillbridge
      - SECRET_KEY=skillbridge-super-secret-key-change-in-prod
      - JWT_SECRET_KEY=SkillBridgeJWT@2026
      - CORS_ORIGINS=*
      - SERVE_FRONTEND=true
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
